<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ cv.name }} – CV</title>
<style>
  /* No letter-spacing on names or headings: some ATS parsers read spaced letters as separate words
     ("S U M M A R Y"). */
  /* Classic: serif, centred header, quiet rules. Timeless and safe for any industry. */
  @page { size: A4; margin: 18mm 20mm; }
  * { box-sizing: border-box; }
  body { font-family: "Liberation Serif", "DejaVu Serif", Georgia, serif; font-size: 10.5pt; line-height: 1.4;
         color: #1d1d1d; margin: 0; }
  p { margin: 0; }
  .cv-header { text-align: center; padding-bottom: 8pt; border-bottom: 1.2pt solid #1d1d1d; margin-bottom: 4pt; }
  .name { font-size: 22pt; font-weight: normal; text-transform: uppercase; margin: 0 0 4pt; }
  .contact { font-size: 9.5pt; color: #4a4a4a; }
  h2 { font-size: 10.5pt; font-weight: bold; text-transform: uppercase; margin: 14pt 0 6pt;
       padding-bottom: 3pt; border-bottom: 0.5pt solid #9a9a9a; }
  .summary { text-align: justify; }
  .job { margin-bottom: 8pt; page-break-inside: avoid; }
  .job-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12pt; }
  .job-title { font-size: 10.5pt; }
  .dates { font-style: italic; color: #4a4a4a; white-space: nowrap; font-size: 9.5pt; }
  .org { font-style: italic; color: #333; margin-bottom: 2pt; }
  .details, .tech { color: #4a4a4a; }
  ul { margin: 3pt 0 0; padding-left: 14pt; }
  ul.bullets { list-style: none; padding-left: 13pt; }
  ul.bullets li { text-indent: -9pt; }
  ul.bullets li::before { content: "•"; display: inline-block; width: 9pt; text-indent: 0; }
  li { margin-bottom: 2pt; }
  ul.plain { list-style: none; padding-left: 0; }
  ul.plain li { margin-bottom: 3pt; }
  .dates-inline { font-style: italic; color: #4a4a4a; }
</style>
</head>
<body>
{% include "_cv_body.html" %}
</body>
</html>
